<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pillarImgTitle pillarImgDesc">
  <title id="pillarImgTitle">The Complete Guide to Spin Wheels</title>
  <desc id="pillarImgDesc">A colorful illustrated spin wheel divided into slices representing giveaways, classrooms, food, yes/no decisions, party games, and numbers</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFBFC"/>
      <stop offset="100%" stop-color="#F0F4F8"/>
    </linearGradient>
    <linearGradient id="wheelShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- floating confetti dots -->
  <circle cx="110" cy="90" r="8" fill="#FFD700"/>
  <circle cx="1080" cy="120" r="10" fill="#2ECC71"/>
  <circle cx="150" cy="520" r="7" fill="#A29BFE"/>
  <circle cx="1050" cy="500" r="9" fill="#FF8C5A"/>
  <circle cx="80" cy="300" r="6" fill="#FF6B35"/>
  <circle cx="1120" cy="300" r="6" fill="#2ECC71"/>
  <rect x="200" y="60" width="14" height="14" rx="3" fill="#FF6B35" transform="rotate(20 207 67)"/>
  <rect x="980" y="70" width="14" height="14" rx="3" fill="#A29BFE" transform="rotate(-15 987 77)"/>

  <!-- wheel shadow -->
  <ellipse cx="600" cy="470" rx="220" ry="26" fill="url(#wheelShadow)"/>

  <!-- stand -->
  <rect x="592" y="360" width="16" height="90" rx="6" fill="#4A5568"/>
  <polygon points="600,330 622,362 578,362" fill="#1A202C"/>

  <!-- wheel base ring -->
  <circle cx="600" cy="300" r="215" fill="#1A202C"/>
  <circle cx="600" cy="300" r="200" fill="#FFFFFF"/>

  <!-- 8 slices -->
  <g stroke="#FFFFFF" stroke-width="4">
    <path d="M600,300 L600,100 A200,200 0 0,1 741.4,158.6 Z" fill="#FF6B35"/>
    <path d="M600,300 L741.4,158.6 A200,200 0 0,1 800,300 Z" fill="#2ECC71"/>
    <path d="M600,300 L800,300 A200,200 0 0,1 741.4,441.4 Z" fill="#A29BFE"/>
    <path d="M600,300 L741.4,441.4 A200,200 0 0,1 600,500 Z" fill="#FFD700"/>
    <path d="M600,300 L600,500 A200,200 0 0,1 458.6,441.4 Z" fill="#FF8C5A"/>
    <path d="M600,300 L458.6,441.4 A200,200 0 0,1 400,300 Z" fill="#2ECC71"/>
    <path d="M600,300 L400,300 A200,200 0 0,1 458.6,158.6 Z" fill="#A29BFE"/>
    <path d="M600,300 L458.6,158.6 A200,200 0 0,1 600,100 Z" fill="#FF6B35"/>
  </g>

  <!-- slice icons -->
  <text x="678" y="180" font-size="34" text-anchor="middle">🎁</text>
  <text x="742" y="255" font-size="34" text-anchor="middle">🏫</text>
  <text x="742" y="345" font-size="34" text-anchor="middle">🍕</text>
  <text x="678" y="425" font-size="34" text-anchor="middle">❓</text>
  <text x="522" y="425" font-size="34" text-anchor="middle">🎮</text>
  <text x="458" y="345" font-size="34" text-anchor="middle">🔢</text>
  <text x="458" y="255" font-size="34" text-anchor="middle">🎨</text>
  <text x="522" y="180" font-size="34" text-anchor="middle">✅</text>

  <!-- hub -->
  <circle cx="600" cy="300" r="34" fill="#1A202C"/>
  <circle cx="600" cy="300" r="26" fill="#FFFFFF"/>
  <text x="600" y="310" font-size="26" text-anchor="middle">🎡</text>

  <!-- pointer -->
  <polygon points="600,80 585,50 615,50" fill="#E85520"/>

  <!-- title lockup -->
  <text x="600" y="580" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700" fill="#1A202C" text-anchor="middle">The Complete Guide to Spin Wheels</text>
  <text x="600" y="608" font-family="'Nunito', sans-serif" font-size="17" fill="#4A5568" text-anchor="middle">Giveaways · Classrooms · Food · Decisions · Games · Productivity</text>
</svg>
