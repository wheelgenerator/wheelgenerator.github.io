<!-- schema: {"@context":"https://schema.org","@type":"ContactPage","name":"Contact Us","url":"https://wheelgenerator.github.io/contact"} -->
<!DOCTYPE html>
<html lang="en">
<head>  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="Get in touch with the WheelGenerator team. Send us your feedback, inquiries, bug reports, or feature requests.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://wheelgenerator.github.io/contact">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <title>Contact Us — WheelGenerator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header-root"></div>

<main>
  <section class="section">
    <div class="container" style="max-width: 700px;">
      <span class="section-label">Get in Touch</span>
      <h1 class="section-title">Contact Us</h1>
      <p class="section-desc" style="margin-bottom: 32px;">Have questions, feedback, or feature suggestions? We'd love to hear from you!</p>

      <div class="feature-card" style="padding: 32px; margin-bottom: 32px;">
        <h3 style="margin-bottom: 8px;">Direct Email</h3>
        <p style="margin-bottom: 16px;">For general inquiries, support, bug reports, or partnership opportunities, reach out directly via email:</p>
        <a href="mailto:rebeccanobelgirl@gmail.com" class="btn-primary" style="display: inline-flex; text-decoration: none;">✉️ rebeccanobelgirl@gmail.com</a>
      </div>

      <div class="content-block" style="display: flex; flex-direction: column; gap: 16px;">
        <h3>Send Us a Message</h3>
        <form action="mailto:rebeccanobelgirl@gmail.com" method="post" enctype="text/plain" style="display: flex; flex-direction: column; gap: 16px;">
          <div>
            <label for="contact-name" style="display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.9rem;">Your Name</label>
            <input type="text" id="contact-name" name="Name" required class="entry-input" style="width: 100%;" placeholder="Enter your name">
          </div>
          <div>
            <label for="contact-email" style="display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.9rem;">Your Email Address</label>
            <input type="email" id="contact-email" name="Email" required class="entry-input" style="width: 100%;" placeholder="name@example.com">
          </div>
          <div>
            <label for="contact-message" style="display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.9rem;">Message</label>
            <textarea id="contact-message" name="Message" rows="5" required class="entry-input" style="width: 100%; font-family: inherit; resize: vertical;" placeholder="How can we help you?"></textarea>
          </div>
          <button type="submit" class="btn-primary" style="align-self: flex-start; cursor: pointer;">Send Message →</button>
        </form>
      </div>
    </div>
  </section>
</main>

<div id="footer-root"></div>

<script src="/header.js"></script>
<script src="/footer.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
